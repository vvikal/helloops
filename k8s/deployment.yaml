apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloops
  namespace: helloops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloops
  template:
    metadata:
      labels:
        app: helloops
    spec:
      containers:
      - name: helloops
        image: helloops:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
          - configMapRef:
              name: helloops-configmap
        env:
          - name: APP_API_KEY
            valueFrom:
              secretKeyRef:
                name: helloops-secret
                key: APP_API_KEY